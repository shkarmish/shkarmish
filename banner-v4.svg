<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sheikh Muhammad Armish, Full Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0a1633"/>
      <stop offset="1" stop-color="#0b2a4f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fe3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c2ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fe3ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="170" cy="60" r="230" fill="url(#glowA)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="270" r="260" fill="url(#glowB)">
      <animate attributeName="cx" values="1040;940;1040" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- left: identity -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <rect x="64" y="52" width="268" height="30" rx="15" fill="#00c2ff" fill-opacity="0.12" stroke="#00c2ff" stroke-opacity="0.5"/>
      <circle cx="84" cy="67" r="5" fill="#2ee6a6">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="98" y="72" font-size="13" font-weight="600" fill="#bfefff" letter-spacing="1.2">CLEAN · SCALABLE · TESTED</text>

      <text x="64" y="150" font-size="52" font-weight="800" fill="url(#name)">Sheikh Muhammad Armish</text>
      <text x="66" y="192" font-size="22" font-weight="600" fill="#d7e6ff">Full Stack Web Developer</text>
      <text x="66" y="222" font-size="17" fill="#8fb2d9">4+ years of experience  ·  Lahore, Pakistan</text>
      <rect x="66" y="238" width="120" height="4" rx="2" fill="url(#accent)"/>

      <g font-size="14" font-weight="600" fill="#e9f6ff">
        <rect x="64"  y="262" width="64"  height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="96"  y="282" text-anchor="middle">PHP</text>
        <rect x="136" y="262" width="88"  height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="180" y="282" text-anchor="middle">Laravel</text>
        <rect x="232" y="262" width="80"  height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="272" y="282" text-anchor="middle">React</text>
        <rect x="320" y="262" width="88"  height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="364" y="282" text-anchor="middle">Next.js</text>
        <rect x="416" y="262" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="470" y="282" text-anchor="middle">WordPress</text>
      </g>
    </g>

    <!-- right: code window -->
    <g transform="translate(800 62)" font-family="Consolas, 'Courier New', monospace">
      <rect width="344" height="196" rx="14" fill="#050816" fill-opacity="0.78" stroke="#7fe3ff" stroke-opacity="0.25"/>
      <rect width="344" height="34" rx="14" fill="#ffffff" fill-opacity="0.06"/>
      <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
      <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
      <circle cx="62" cy="17" r="6" fill="#27c93f"/>
      <text x="172" y="22" font-size="12" fill="#7f9bc0" text-anchor="middle">developer.ts</text>

      <g font-size="15">
        <text x="22" y="68"><tspan fill="#7c5cff">const</tspan> <tspan fill="#7fe3ff">armish</tspan> <tspan fill="#d7e6ff">= {</tspan></text>
        <text x="42" y="94"><tspan fill="#9fb8d8">role:</tspan> <tspan fill="#2ee6a6">"Full Stack Developer"</tspan><tspan fill="#d7e6ff">,</tspan></text>
        <text x="42" y="120"><tspan fill="#9fb8d8">stack:</tspan> <tspan fill="#2ee6a6">["PHP","Next.js","React"]</tspan><tspan fill="#d7e6ff">,</tspan></text>
        <text x="42" y="146"><tspan fill="#9fb8d8">ai:</tspan> <tspan fill="#2ee6a6">"used as an assistant"</tspan><tspan fill="#d7e6ff">,</tspan></text>
        <text x="42" y="172"><tspan fill="#9fb8d8">ships:</tspan> <tspan fill="#ffbd2e">fast</tspan><tspan fill="#d7e6ff">,</tspan> <tspan fill="#9fb8d8">tested:</tspan> <tspan fill="#ffbd2e">true</tspan></text>
        <text x="22" y="190" fill="#d7e6ff">};<tspan fill="#00c2ff">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>▍</tspan></text>
      </g>
    </g>

    <rect x="0" y="312" width="1200" height="8" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#7fe3ff" stroke-opacity="0.18"/>
</svg>
